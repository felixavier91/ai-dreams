<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Dreams</title>
<meta name="description" content="Pictures and silent films made by AI models running on one small computer at home.">
<meta name="theme-color" content="#000">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { opacity: 0; transition: opacity 2.5s ease-out; }
  body.awake { opacity: 1; }
  body.still { cursor: none; }
  #top, #new { transition: opacity .4s; }
  body.still #top, body.still #new { opacity: 0; transition: opacity 1.5s; }
  html { scrollbar-width: none; }
  body::-webkit-scrollbar { display: none; }
  #feed { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: calc(56px + env(safe-area-inset-top)) 0 40px; }
  /* each card is exactly the size of its picture: as tall as the screen allows, or as wide as the screen allows on a
     narrow phone, whichever comes first, so cards sit back to back with no empty band (--ar = width / height) */
  .dream { position: relative; display: flex; justify-content: center; }
  .frame { position: relative; --ar: 0.75; width: min(96vw, calc(min(100vh - 20px, 1100px) * var(--ar))); aspect-ratio: var(--ar); border-radius: 10px; overflow: hidden; background: #111; }
  .frame img, .frame video { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 1.2s; }
  .frame img.in, .frame video.in { opacity: 1; }
  .frame img.breathe { animation: breathe 28s ease-in-out infinite alternate; animation-play-state: paused; transform-origin: var(--ox, 50%) var(--oy, 50%); }
  .dream.near .frame img.breathe { animation-play-state: running; }
  @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.1) translate(var(--dx, 0), var(--dy, 0)); } }
  /* tap a dream: the prompt its picture model was given slides up over it; tap again and it goes */
  .dream.has-prompt { cursor: pointer; }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; max-height: 70%; overflow-y: auto; padding: 44px 16px 16px; font-size: 14px; line-height: 1.45; color: #fff;
         background: linear-gradient(transparent, rgba(0,0,0,.82) 44px); white-space: pre-wrap; opacity: 0; pointer-events: none; transition: opacity .35s; scrollbar-width: none; }
  .dream.show .cap { opacity: 1; pointer-events: auto; }
  body.still .dream.has-prompt { cursor: none; }
  #tint { position: fixed; inset: -10%; background-size: cover; background-position: center; filter: blur(70px) saturate(1.3); opacity: 0; transition: opacity 2s, background-image 1.5s; z-index: -1; }
  #tint.on { opacity: .45; }
  button { background: rgba(0,0,0,.5); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; backdrop-filter: blur(6px); }
  #top { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; padding: 0 16px; z-index: 5; pointer-events: none; }
  #logo { font-weight: 700; letter-spacing: .12em; font-size: 12px; text-transform: uppercase; opacity: .85; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  #new { display: none; position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 5; }
  #empty { height: 80vh; display: grid; place-items: center; color: rgba(255,255,255,.72); }
</style>
</head>
<body>
<div id="top"><span id="logo">AI Dreams</span></div>
<button id="new">New dreams ↑</button>
<div id="tint"></div>
<div id="feed"><div id="empty">…</div></div>
<script>
// Pictures and silent videos only. A video starts by itself, muted, and loops; no sound. The only words are the
// prompt behind a dream, and only when it is tapped.
const feed = document.getElementById('feed');
function hash(s) { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; }
let known = new Set(), pending = [];

function card(d) {
  const el = document.createElement('section');
  el.className = 'dream'; el.dataset.id = d.id; el.dataset.image = d.image || '';
  const frame = document.createElement('div'); frame.className = 'frame';
  if (d.video) {
    const v = document.createElement('video');
    v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.preload = 'none';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.disablePictureInPicture = true;
    if (d.image) v.poster = d.image;
    v.dataset.src = d.video;
    v.addEventListener('loadedmetadata', () => { if (v.videoWidth) frame.style.setProperty('--ar', v.videoWidth / v.videoHeight); });
    frame.appendChild(v);
  } else {
    const r = hash(d.id), i = document.createElement('img');
    i.className = 'breathe'; i.alt = ''; i.dataset.src = d.image;
    i.style.cssText = `--dx:${((r >>> 11) % 7 - 3) * 1.2}%;--dy:${((r >>> 14) % 7 - 3) * 1.2}%;--ox:${20 + (r >>> 17) % 60}%;--oy:${20 + (r >>> 20) % 60}%`;
    frame.appendChild(i);
  }
  if (d.prompt) {
    const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = d.prompt;
    frame.appendChild(cap); el.classList.add('has-prompt');
    el.onclick = () => el.classList.toggle('show');
  }
  el.appendChild(frame);
  return el;
}
function hydrate(el) {
  if (el.dataset.ready) return; el.dataset.ready = 1;
  el.querySelectorAll('[data-src]').forEach(m => { m.src = m.dataset.src; m.removeAttribute('data-src'); if (m.tagName === 'IMG') m.onload = () => { if (m.naturalWidth) m.parentElement.style.setProperty('--ar', m.naturalWidth / m.naturalHeight); m.classList.add('in'); }; else m.classList.add('in'); });
}
// whatever is on or near the screen is loaded; its video runs, and rests again once it is far away
const seen = new IntersectionObserver(es => es.forEach(e => {
  const el = e.target, v = el.querySelector('video');
  el.classList.toggle('near', e.isIntersecting);
  if (e.isIntersecting) { hydrate(el); if (v) { v.muted = true; v.play().catch(() => {}); } }
  else if (v) v.pause();
}), { rootMargin: '60% 0px' });

let ticking = false;
function retint() {
  ticking = false;
  const mid = innerHeight / 2; let best = null, dist = Infinity;
  document.querySelectorAll('.dream').forEach(el => { const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return; const d = Math.abs((r.top + r.bottom) / 2 - mid); if (d < dist) { dist = d; best = el; } });
  const tint = document.getElementById('tint');
  if (best && best.dataset.image) { const u = `url('${best.dataset.image}')`; if (tint.style.backgroundImage !== u) tint.style.backgroundImage = u; tint.classList.add('on'); } else tint.classList.remove('on');
}
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(retint); } }, { passive: true });
addEventListener('resize', retint);

function render(list, prepend = false) {
  const empty = document.getElementById('empty'); if (empty && list.length) empty.remove();
  const frag = document.createDocumentFragment();
  list.forEach(d => { known.add(d.id); const c = card(d); frag.appendChild(c); seen.observe(c); });
  prepend ? feed.prepend(frag) : feed.appendChild(frag);
  requestAnimationFrame(retint);
}
async function load(first = false) {
  let data; try { data = await (await fetch('feed.json', { cache: 'no-store' })).json(); } catch { return; }
  const fresh = data.filter(d => (d.image || d.video) && !known.has(d.id));
  if (!fresh.length) return;
  if (first) { render(fresh); return; }
  if (scrollY < 10) { render(fresh, true); scrollTo(0, 0); }
  else { pending = fresh.concat(pending); const b = document.getElementById('new'); b.textContent = `${pending.length} new ↑`; b.style.display = 'block'; }
}
document.getElementById('new').onclick = () => { render(pending, true); pending = []; document.getElementById('new').style.display = 'none'; scrollTo({ top: 0, behavior: 'smooth' }); };
load(true); setInterval(load, 30000);
requestAnimationFrame(() => document.body.classList.add('awake'));
let stillTimer; function stir() { document.body.classList.remove('still'); clearTimeout(stillTimer); stillTimer = setTimeout(() => document.body.classList.add('still'), 3500); }
['pointermove', 'pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, stir, { passive: true })); stir();
</script>
</body>
</html>
